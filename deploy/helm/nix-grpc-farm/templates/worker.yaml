{{- include "farm.validate" . }}
{{- $root := . }}
{{- $oidc := include "farm.oidcProviders" . }}
{{- $spire := .Values.tls.worker.spire }}
{{- $clientCA := include "farm.tlsSecret" (list . "clientCA") }}
{{- /* TLS towards the balancer: a certificate from a Secret, or the SVID */}}
{{- $tls := or (include "farm.tlsSecret" (list . "worker")) $spire.agentSocket }}
{{- range $g, $overrides := .Values.workers }}
{{- $w := mustMergeOverwrite (deepCopy $root.Values.workerDefaults) ($overrides | default dict) }}
{{- $svc := include "farm.workerService" (dict "root" $root "group" $g) }}
{{- $sel := include "farm.workerSelectorLabels" (dict "root" $root "group" $g) }}
{{- if and $w.advertise (not $w.hostPort) }}{{ fail (printf "workers.%s.advertise needs hostPort" $g) }}{{ end }}
{{- $affinity := deepCopy ($w.affinity | default dict) }}
{{- if $w.advertise }}
{{- if hasKey $affinity "nodeAffinity" }}{{ fail (printf "workers.%s: advertise sets the nodeAffinity, drop affinity.nodeAffinity" $g) }}{{ end }}
{{- $_ := set $affinity "nodeAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (dict "nodeSelectorTerms" (list (dict "matchExpressions" (list (dict "key" "kubernetes.io/hostname" "operator" "In" "values" (keys $w.advertise | sortAlpha))))))) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels: {{- include "farm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    nix-grpc-farm/group: {{ $g }}
spec:
  # Headless: envoy resolves one endpoint per Ready pod.
  clusterIP: None
  selector: {{- $sel | nindent 4 }}
  ports:
    - name: grpc
      port: 50051
    - name: metrics
      port: 9464
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $svc }}
  labels: {{- include "farm.labels" $root | nindent 4 }}
data:
  farm.conf: |
    # The cache first: a path another worker just pushed must be found there.
    substituters = {{ $root.Values.niks3.cacheURL }} {{ join " " $root.Values.upstreamCaches.urls }}
    trusted-public-keys = {{ join " " (concat $root.Values.niks3.publicKeys $root.Values.upstreamCaches.publicKeys) }}
    narinfo-cache-negative-ttl = 0
    build-dir = /build
    keep-build-log = true
    max-jobs = {{ $w.maxJobs }}
    cores = {{ $w.cores }}
    system-features = {{ join " " $w.features }}
    {{- with $w.system }}
    system = {{ . }}
    {{- end }}
    {{- if not $root.Values.sandbox.enabled }}
    sandbox = false
    {{- end }}
    {{- with $w.extraNixConf }}
    {{- . | nindent 4 }}
    {{- end }}
{{- if $spire.agentSocket }}
---
# spiffe-helper keeps the SVID files; the init container runs the same
# config once so the daemon finds them at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $svc }}-spiffe-helper
  labels: {{- include "farm.labels" $root | nindent 4 }}
data:
  helper.conf: |
    {{- include "farm.spiffeHelperConf" (dict "root" $root "daemon" true) | nindent 4 }}
  helper-once.conf: |
    {{- include "farm.spiffeHelperConf" (dict "root" $root "daemon" false) | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}
  labels: {{- include "farm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    nix-grpc-farm/group: {{ $g }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels: {{- $sel | nindent 6 }}
  strategy:
    type: RollingUpdate
    {{- if $w.hostPort }}
    # The new pod needs the old one's node port.
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
    {{- else }}
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
    {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ print $w $root.Values.niks3 $root.Values.upstreamCaches $root.Values.sandbox $oidc $spire | sha256sum }}
        {{- with $w.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- $sel | nindent 8 }}
        {{- with $w.system }}
        nix-grpc-farm/system: {{ . }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "farm.serviceAccountName" $root }}
      # For OIDC discovery against the API server and the projected niks3 token.
      automountServiceAccountToken: {{ or $root.Values.auth.workloadIdentity.enabled $root.Values.niks3.auth.serviceAccountToken.enabled }}
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      # preStop hooks below wait for nix-grpc-daemon to exit.
      shareProcessNamespace: true
      {{- if and $root.Values.sandbox.enabled (not $root.Values.sandbox.privileged) }}
      hostUsers: false
      {{- end }}
      {{- with $root.Values.sandbox.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "farm.spread" (dict "spread" $w.spread "selector" $sel) | nindent 6 }}
      initContainers:
        # /nix is an emptyDir so the store is writable and sized. Seed it
        # from the image. The image's DB registration comes along.
        - name: seed-store
          image: {{ include "farm.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              # emptyDir is world-writable, which nix refuses for build-dir.
              chmod 0755 /build
              # A restart can pull a newer image whose /bin points at store paths the volume lacks.
              if [ -e /vol/nix/var/nix/db/db.sqlite ] &&
                 [ "$(readlink /vol/nix/var/nix/gcroots/image)" = "$(readlink /nix/var/nix/gcroots/image)" ]; then exit 0; fi
              rm -rf /vol/nix
              mkdir -p /vol/nix
              cp -a /nix/store /nix/var /vol/nix/
              mkdir -p /vol/nix/var/nix/daemon-socket /vol/nix/var/nix/gcroots /vol/nix/var/nix/profiles
          volumeMounts:
            - {name: nix, mountPath: /vol}
            - {name: build, mountPath: /build}
        {{- if $spire.agentSocket }}
        - name: svid-init
          image: {{ $spire.image }}
          args: [-config, /etc/spiffe-helper/helper-once.conf]
          securityContext: {{- include "farm.spiffeHelperSecurityContext" $root | nindent 12 }}
          volumeMounts: {{- include "farm.spiffeHelperMounts" $root | nindent 12 }}
        {{- if $clientCA }}
        # The daemon must find trust.pem at start; the trust container keeps it after.
        - name: trust-init
          image: {{ include "farm.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: [/bin/sh, -ec, "cat /secrets/ca/ca.crt /svid/bundle.pem > /svid/trust.pem"]
          securityContext: {{- include "farm.spiffeHelperSecurityContext" $root | nindent 12 }}
          volumeMounts:
            - {name: svid, mountPath: /svid}
            - {name: ca, mountPath: /secrets/ca, readOnly: true}
        {{- end }}
        {{- end }}
      containers:
        - name: nix-daemon
          image: {{ include "farm.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: [/bin/nix-daemon]
          # Outlive nix-grpc-daemon so draining builds keep their builder.
          lifecycle:
            preStop:
              exec:
                command: [/bin/sh, -c, "while pgrep -f ^/bin/nix-grpc-daemon >/dev/null; do sleep 1; done"]
          securityContext:
            runAsUser: 0
            {{- if and $root.Values.sandbox.enabled $root.Values.sandbox.privileged }}
            privileged: true
            {{- else if $root.Values.sandbox.enabled }}
            # Mount and user namespaces for the sandbox, inside the pod's user namespace.
            capabilities: {add: [SYS_ADMIN]}
            procMount: Unmasked
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
            {{- end }}
          env:
            - {name: TMPDIR, value: /build}
          volumeMounts:
            - {name: nix, mountPath: /nix, subPath: nix}
            - {name: build, mountPath: /build}
            - {name: nixconf, mountPath: /etc/nix/nix.conf.d}
          livenessProbe:
            exec:
              command: [nix, store, info, --store, daemon]
            periodSeconds: 30
            timeoutSeconds: 10
          {{- with $w.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: nix-grpc-daemon
          image: {{ include "farm.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if $w.advertise }}
          command:
            - /bin/sh
            - -ec
            - |
              case "$NODE_NAME" in
              {{- range $node, $ip := $w.advertise }}
                {{ $node }}) host={{ $ip }} ;;
              {{- end }}
                *) echo "no advertise address for node $NODE_NAME" >&2; exit 1 ;;
              esac
              exec /bin/nix-grpc-daemon --advertise="$host:{{ $w.hostPort }}" "$@"
            - nix-grpc-daemon
          {{- else }}
          command: [/bin/nix-grpc-daemon]
          {{- end }}
          args:
            - --role=builder
            - --listen=[::]:50051
            {{- if not $w.advertise }}
            # What the balancer reaches this pod at, so x-nix-worker pins here.
            - --advertise=$({{ if $w.hostPort }}HOST_IP):{{ $w.hostPort }}{{ else }}POD_IP):50051{{ end }}
            {{- end }}
            - --scheduler={{ if not $tls }}http://{{ end }}{{ include "farm.schedulerFor" $root }}
            # civetweb binds [::] v6-only. Pod IPs are v4 on most clusters.
            - --metrics-listen=0.0.0.0:9464
            - --worker-name=$(NODE_NAME)/$(POD_NAME)
            - --log-level={{ $root.Values.logLevel }}
            - --niks3={{ $root.Values.niks3.serverURL }}
            - --niks3-token-file={{ if $spire.niks3Token }}/svid/niks3-token{{ else }}/secrets/niks3/token{{ end }}
            {{- with $root.Values.niks3.pushFlags }}
            - --niks3-push=niks3 push {{ join " " . }}
            {{- end }}
            - --min-free={{ $w.minFree }}
            {{- if $spire.agentSocket }}
            - --tls-cert=/svid/svid.pem
            - --tls-key=/svid/svid.key
            {{- else if (include "farm.tlsSecret" (list $root "worker")) }}
            - --tls-cert=/secrets/tls/tls.crt
            - --tls-key=/secrets/tls/tls.key
            {{- end }}
            {{- if or $clientCA $spire.agentSocket }}
            {{- /* with a CA named next to the SVID both roots are trusted, so a balancer on a farm-CA certificate still gets in while the farm moves */}}
            - --client-ca={{ if not $spire.agentSocket }}/secrets/ca/ca.crt{{ else if $clientCA }}/svid/trust.pem{{ else }}/svid/bundle.pem{{ end }}
            {{- range $root.Values.auth.trustedProxies }}
            - --trusted-proxy={{ . }}
            {{- end }}
            {{- end }}
            {{- range $root.Values.auth.accessRules }}
            - --allow={{ .cn }}={{ .role }}
            {{- end }}
            {{- with $root.Values.auth.anonymousRole }}
            - --allow-anonymous={{ . }}
            {{- end }}
            {{- if $root.Values.auth.trustClients }}
            - --trust-clients
            {{- end }}
            {{- if $oidc }}
            - --oidc-config=/secrets/oidc/oidc.json
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: TMPDIR, value: /spool}
          securityContext:
            runAsUser: 990
            runAsGroup: 990
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - name: grpc
              containerPort: 50051
              {{- with $w.hostPort }}
              hostPort: {{ . }}
              {{- end }}
            - name: metrics
              containerPort: 9464
              {{- with $w.metricsHostPort }}
              hostPort: {{ . }}
              {{- end }}
          {{- /* kubelet gRPC probes are plaintext; with TLS fall back to TCP and let envoy judge health. */}}
          {{- $probe := ternary (dict "tcpSocket" (dict "port" 50051)) (dict "grpc" (dict "port" 50051)) (not (empty $tls)) }}
          # Covers the store seed and niks3 becoming reachable.
          startupProbe: {{- toYaml (merge (dict "periodSeconds" 5 "failureThreshold" 120) $probe) | nindent 12 }}
          # Ready only while the local nix-daemon answers, not just the gRPC port.
          readinessProbe:
            exec:
              command: [nix, store, info, --store, daemon]
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe: {{- toYaml (merge (dict "periodSeconds" 30 "timeoutSeconds" 10) $probe) | nindent 12 }}
          volumeMounts:
            - {name: nix, mountPath: /nix, subPath: nix}
            - {name: spool, mountPath: /spool}
            - {name: nixconf, mountPath: /etc/nix/nix.conf.d}
            {{- if not $spire.niks3Token }}
            - {name: niks3-token, mountPath: /secrets/niks3, readOnly: true}
            {{- end }}
            {{- if $spire.agentSocket }}
            - {name: svid, mountPath: /svid, readOnly: true}
            {{- else if (include "farm.tlsSecret" (list $root "worker")) }}
            - {name: tls, mountPath: /secrets/tls, readOnly: true}
            {{- end }}
            {{- if $clientCA }}
            - {name: ca, mountPath: /secrets/ca, readOnly: true}
            {{- end }}
            {{- if $oidc }}
            - {name: oidc, mountPath: /secrets/oidc, readOnly: true}
            {{- end }}
          {{- with $w.daemonResources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: gc
          image: {{ include "farm.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              while :; do
                harmonia-gc --ensure-free {{ $root.Values.gc.ensureFree }} --no-vacuum
                {{- with $root.Values.gc.keepRecent }} --keep-recent {{ . }}{{ end }} || echo "gc: exit $?" >&2
                sleep {{ $root.Values.gc.interval }}
              done
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: nix, mountPath: /nix, subPath: nix}
            - {name: nixconf, mountPath: /etc/nix/nix.conf.d}
          {{- with $root.Values.gc.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $spire.agentSocket }}
        - name: spiffe-helper
          image: {{ $spire.image }}
          args: [-config, /etc/spiffe-helper/helper.conf]
          securityContext: {{- include "farm.spiffeHelperSecurityContext" $root | nindent 12 }}
          volumeMounts: {{- include "farm.spiffeHelperMounts" $root | nindent 12 }}
        {{- if $clientCA }}
        # The helper image has no shell: this joins the CA and the bundle
        # again after each rotation, and the daemon re-reads the file.
        - name: trust
          image: {{ include "farm.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              while :; do
                cat /secrets/ca/ca.crt /svid/bundle.pem > /svid/trust.pem.new && mv /svid/trust.pem.new /svid/trust.pem
                sleep 60
              done
          securityContext: {{- include "farm.spiffeHelperSecurityContext" $root | nindent 12 }}
          volumeMounts:
            - {name: svid, mountPath: /svid}
            - {name: ca, mountPath: /secrets/ca, readOnly: true}
        {{- end }}
        {{- end }}
      volumes:
        - name: nix
          emptyDir: {{- if $w.store.sizeLimit }} {sizeLimit: {{ $w.store.sizeLimit }}} {{- else }} {} {{- end }}
        - name: spool
          emptyDir: {{- if $w.spool.sizeLimit }} {sizeLimit: {{ $w.spool.sizeLimit }}} {{- else }} {} {{- end }}
        - name: build
          emptyDir:
            {{- if or $w.buildDir.medium $w.buildDir.sizeLimit }}
            {{- with $w.buildDir.medium }}
            medium: {{ . }}
            {{- end }}
            {{- with $w.buildDir.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
            {{- else }} {}
            {{- end }}
        - name: nixconf
          configMap:
            name: {{ $svc }}
        {{- if not $spire.niks3Token }}
        - name: niks3-token
          {{- if $root.Values.niks3.auth.serviceAccountToken.enabled }}
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $root.Values.niks3.auth.serviceAccountToken.audience }}
                  expirationSeconds: {{ $root.Values.niks3.auth.serviceAccountToken.expirationSeconds }}
          {{- else }}
          secret:
            secretName: {{ $root.Values.niks3.auth.existingSecret }}
            items: [{key: token, path: token}]
          {{- end }}
        {{- end }}
        {{- if $spire.agentSocket }}
        - name: spire-agent-socket
          # the directory, not the socket: an agent restart replaces the file
          hostPath: {path: {{ dir $spire.agentSocket }}, type: Directory}
        - name: svid
          emptyDir: {medium: Memory}
        - name: spiffe-helper
          configMap:
            name: {{ $svc }}-spiffe-helper
        {{- else }}
        {{- with (include "farm.tlsSecret" (list $root "worker")) }}
        - name: tls
          secret: {secretName: {{ . }}}
        {{- end }}
        {{- end }}
        {{- with $clientCA }}
        - name: ca
          secret: {secretName: {{ . }}, items: [{key: ca.crt, path: ca.crt}]}
        {{- end }}
        {{- if $oidc }}
        - name: oidc
          secret:
            secretName: {{ include "farm.fullname" $root }}-oidc
        {{- end }}
{{- end }}
